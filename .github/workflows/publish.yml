name: bsud crate.io publishing
on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  publish:
    environment: publish
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Stable Rust with rustfmt
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: stable
        components: rustfmt
    - name: Cargo publish
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}