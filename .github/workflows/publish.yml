name: bsud crate.io publishing
on:
  release:
    types: [released]

jobs:
  publish:
    environment: publish
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - name: Stable Rust with rustfmt
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
      with:
        profile: minimal
        toolchain: stable
        components: rustfmt
    - name: Cargo publish
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}