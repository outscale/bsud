name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:  

permissions:
  contents: write

jobs:
  release:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            fetch-depth: 0

        - name: Create Release
          uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
          if: startsWith(github.ref, 'refs/tags/')
          with:
            tag_name: ${{ github.ref_name }}
            name: Release ${{ github.ref_name }}
            draft: true
            prerelease: false
            generate_release_notes: true
  artefact:
    strategy:
          matrix:
            include:
              - name: Linux x86_64
                os: ubuntu-latest
                target: x86_64-unknown-linux-musl
                suffix: ''
    runs-on: ${{ matrix.os }}
    name: Create artefact for ${{ matrix.name }}
    needs: [release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stable Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        run: sudo apt update -y && sudo apt install musl-tools -y
        if: matrix.os == 'ubuntu-latest'
      - name: Build
        run: cargo build --target ${{ matrix.target }} --release
      - name: Move binary
        run: mv target/${{ matrix.target }}/release/bsud${{ matrix.suffix }} bsud-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}
      - name: Upload Artefact to release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: bsud-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}